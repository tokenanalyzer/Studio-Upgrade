kind = "web"
previewPath = "/"
title = "MD Studio"
version = "1.0.0"
id = "artifacts/md-studio"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 21763

[services.development]
run = "pnpm --filter @workspace/md-studio run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/md-studio", "run", "build" ]
publicDir = "artifacts/md-studio/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "21763"
BASE_PATH = "/"
